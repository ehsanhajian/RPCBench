<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="0 0 900 212" role="img" aria-label="Quick start">
<rect width="900" height="212" rx="10" fill="#0d1117"/>
<rect width="900" height="36" rx="10" fill="#161b22"/>
<rect y="26" width="900" height="10" fill="#161b22"/>
<circle cx="18" cy="18" r="5" fill="#ff5f57"/>
<circle cx="36" cy="18" r="5" fill="#febc2e"/>
<circle cx="54" cy="18" r="5" fill="#28c840"/>
<text x="450.0" y="23" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12">Quick start</text>
<text x="22" y="68" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">pip install rpcbench</text>
<text x="22" y="90" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve"></text>
<text x="22" y="112" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">rpcbench compare --endpoints endpoints.yaml</text>
<text x="22" y="134" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">rpcbench compare --endpoints endpoints.yaml --workload wallet</text>
<text x="22" y="156" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">rpcbench compare --endpoints endpoints.yaml --html -o report.html</text>
<text x="22" y="178" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">rpcbench compare --endpoints endpoints.yaml --out-dir out --ci --max-p95 500</text>
</svg>
