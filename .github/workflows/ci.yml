name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest

  smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: evm
            endpoints: endpoints.ci.yaml
            method: eth_blockNumber
          - name: solana
            endpoints: endpoints.ci.solana.yaml
            method: getSlot
          - name: substrate
            endpoints: endpoints.ci.substrate.yaml
            method: chain_getHeader
          - name: cosmos
            endpoints: endpoints.ci.cosmos.yaml
            method: status
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Live public RPC smoke (${{ matrix.name }})
        run: >
          rpcbench run
          --endpoints ${{ matrix.endpoints }}
          --method ${{ matrix.method }}
          --samples 1
          --warmup 0
          --max-requests 8
          --timeout 15
