# Named RPC endpoints. Localhost and RFC1918 are allowed.
# Copy to endpoints.yaml and edit. JSON with the same shape also works.
# Secrets in query strings, path tokens, userinfo, bearer, and headers
# are stripped from reports; a short hash of the raw URL is kept instead.
# Compare one family at a time (evm, solana, substrate, cosmos, or aptos).

endpoints:
  - name: local
    url: http://127.0.0.1:8545
    # family: evm   # default
    # ws: ws://127.0.0.1:8546

  # EVM (Ethereum)
  - name: eth-publicnode
    url: https://ethereum.publicnode.com
    family: evm
    # ws: wss://ethereum.publicnode.com

  # Solana
  - name: sol-publicnode
    url: https://solana-rpc.publicnode.com
    family: solana
    # ws: wss://solana-rpc.publicnode.com

  # Substrate (Polkadot — same adapter for Kusama / parachains)
  - name: dot-publicnode
    url: https://polkadot-rpc.publicnode.com
    family: substrate
    # ws: wss://polkadot-rpc.publicnode.com

  # Cosmos (CometBFT JSON-RPC — not Cosmos EVM eth_*)
  - name: atom-publicnode
    url: https://cosmos-rpc.publicnode.com
    family: cosmos

  # Aptos fullnode REST (URL includes /v1)
  - name: aptos-labs
    url: https://fullnode.mainnet.aptoslabs.com/v1
    family: aptos

